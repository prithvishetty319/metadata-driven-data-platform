[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-driven-data-platform"
version = "1.0.0"
description = "Compile governed pipeline metadata into production data-platform assets"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
where = ["src"]

